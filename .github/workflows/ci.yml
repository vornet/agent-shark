name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet test -c Release --no-restore --logger trx --collect:"XPlat Code Coverage"
      - run: dotnet pack src/AgentShark.Server -c Release --no-restore -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: '**/TestResults/**'
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t agent-shark-tests .
      - run: docker run --rm --cap-add NET_RAW agent-shark-tests
